<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="triorbit-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101D35" />
      <stop offset="100%" stop-color="#080F20" />
    </linearGradient>
    <linearGradient id="triorbit-cyan" x1="16" y1="8" x2="16" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60E5F4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#60E5F4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="32" height="32" rx="7" fill="url(#triorbit-bg)" stroke="#1F3352" stroke-width="1.2" />

  <!-- Inclined Orbital Ellipse Track -->
  <ellipse cx="16" cy="17" rx="11" ry="4.5" transform="rotate(-24 16 17)" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="32 0" />

  <!-- TriOrbit Central Command Triangle -->
  <path d="M16 7.5 L23.5 21.5 L8.5 21.5 Z" fill="url(#triorbit-cyan)" stroke="#60E5F4" stroke-width="1" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Apex Core Accent -->
  <path d="M16 11.5 L19.8 19 L12.2 19 Z" fill="#101D35" opacity="0.65" />

  <!-- Orbiting Satellite Marker -->
  <circle cx="24.5" cy="13" r="1.6" fill="#F4F7FC" stroke="#60E5F4" stroke-width="0.8" />
</svg>
